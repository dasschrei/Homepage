<!doctype html>
<html lang="de" data-nur-daten>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Das Schrei – Links</title>
<meta name="description" content="Reservierung, Gutscheine und aktuelle Events von Das Schrei in Salzburg.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#151512">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Das Schrei">
<meta property="og:title" content="Das Schrei – Links">
<meta property="og:description" content="Reservierung, Gutscheine und aktuelle Events von Das Schrei in Salzburg.">
<meta property="og:image" content="https://www.das-schrei.at/assets/img/hero-1200.jpg">
<link rel="stylesheet" href="assets/fonts/fonts.css?v=20261011">
<link rel="icon" href="assets/favicon-48.png" sizes="48x48" type="image/png">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<style>
:root{--ink:#151512;--ink-2:#1e1e1a;--cream:#f4f1ea;--sand:#d7d0c2;--line:rgba(244,241,234,.16);--line-strong:rgba(244,241,234,.32)}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ink);color:var(--cream);font-family:"DM Sans",system-ui,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{max-width:520px;margin:0 auto;padding:48px 16px 40px}
.head{text-align:center;margin-bottom:36px}
.mark{display:inline-block;font-family:"Roboto","DM Sans",sans-serif;font-size:40px;letter-spacing:.02em;line-height:1}
.tag{margin:12px 0 0;font-size:12px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--sand)}
.links{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:16px;padding:10px 16px 10px 10px;min-height:88px;background:var(--ink-2);border:1px solid var(--line);border-radius:4px;transition:border-color .3s,background .3s}
.row:hover,.row:focus-visible{border-color:var(--line-strong);background:#24241f}
.row:focus-visible{outline:2px solid var(--sand);outline-offset:2px}
.thumb{flex:0 0 68px;width:68px;height:68px;border-radius:3px;overflow:hidden;background:#2a2a25}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.txt{flex:1;min-width:0}
.t{display:block;font-size:17px;font-weight:500;line-height:1.3}
.s{display:block;margin-top:2px;font-size:14px;color:rgba(244,241,234,.68)}
.arrow{flex:0 0 auto;width:22px;height:1px;background:currentColor;position:relative;opacity:.7}
.arrow::after{content:"";position:absolute;right:0;top:-4px;width:8px;height:8px;border-top:1px solid currentColor;border-right:1px solid currentColor;transform:rotate(45deg)}
.label{display:flex;align-items:center;gap:16px;margin:44px 0 16px;font-size:12px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--sand)}
.label::before{content:"";display:block;width:40px;height:1px;background:currentColor}
.events{display:flex;flex-direction:column;gap:20px}
.event{display:block;background:var(--ink-2);border:1px solid var(--line);border-radius:4px;overflow:hidden;transition:border-color .3s}
.event:hover,.event:focus-visible{border-color:var(--line-strong)}
.event:focus-visible{outline:2px solid var(--sand);outline-offset:2px}
.event__img{aspect-ratio:16 / 9;overflow:hidden;background:#2a2a25}
.event__img img{width:100%;height:100%;object-fit:cover;display:block}
.event__body{padding:20px 20px 22px}
.when{margin:0;font-size:12px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--sand)}
.title{margin:10px 0 0;font-family:"Italiana","Didot",serif;font-weight:400;font-size:32px;line-height:1.08}
.foot{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:18px;flex-wrap:wrap}
.price{font-size:15px;color:rgba(244,241,234,.8)}
.price small{display:block;font-size:13px;color:rgba(244,241,234,.6)}
.btn{display:inline-flex;align-items:center;gap:12px;min-height:44px;padding:0 20px;border:1px solid var(--line-strong);border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
.btn .arrow{width:16px;opacity:1}
.btn .arrow::after{width:6px;height:6px;top:-3px}
.footer{margin-top:52px;text-align:center;font-size:13px;color:rgba(244,241,234,.6);line-height:1.7}
.footer a{text-decoration:underline;text-underline-offset:3px}
</style>
</head>
<body>
<main class="wrap">
  <header class="head">
    <a class="mark" href="./" aria-label="Das Schrei – zur Website">SCHREI</a>
    <p class="tag">Casual Fine Dining · Salzburg</p>
  </header>

  <nav class="links" aria-label="Links">
    <a class="row" href="./">
      <span class="thumb"><img src="assets/img/hero-1200.jpg" alt="" loading="eager"></span>
      <span class="txt"><span class="t">Website</span><span class="s">das-schrei.at</span></span>
      <i class="arrow" aria-hidden="true"></i>
    </a>
    <a class="row" id="link-reservieren" href="https://bookings.zenchef.com/results?rid=368147&amp;pid=1001">
      <span class="thumb"><img src="assets/img/gastraum-raum-800.jpg" alt="" loading="eager"></span>
      <span class="txt"><span class="t">Tisch reservieren</span><span class="s">Gastraum &amp; Chef’s Table</span></span>
      <i class="arrow" aria-hidden="true"></i>
    </a>
    <a class="row" id="link-gutscheine" href="https://shop.zenchef.com/?active-collection=vouchers&amp;collections=vouchers&amp;shop-id=sh_fa45842d-b087-4dc6-b5e8-7543da231ad8&amp;language=de&amp;primary-color=cccccc">
      <span class="thumb"><img src="assets/img/einschenken-800.jpg" alt="" loading="eager"></span>
      <span class="txt"><span class="t">Gutscheine</span><span class="s">Einen Abend bei uns verschenken</span></span>
      <i class="arrow" aria-hidden="true"></i>
    </a>
  </nav>

  <section id="events" aria-label="Kommende Events" hidden>
    <p class="label">Kommende Events</p>
    <div class="events"></div>
  </section>

  <footer class="footer">
    Josef-von-Eichendorff-Straße 5 · 5020 Salzburg<br>
    <a href="tel:+436641541102">+43 664 1541102</a> · <a href="impressum.html">Impressum &amp; Datenschutz</a>
  </footer>
</main>

<script src="assets/site.js?v=20261016"></script>
<script>
(() => {
  const D = window.SCHREI_DATEN;
  if (!D) return;
  // Links immer aus derselben Quelle wie die Website
  const r = document.getElementById('link-reservieren'); if (r && D.RESERVIEREN) r.href = D.RESERVIEREN;
  const g = document.getElementById('link-gutscheine'); if (g && D.GUTSCHEINE) g.href = D.GUTSCHEINE;

  const pick = v => v && typeof v === 'object' ? (v.de || v.en) : v;
  const d = s => { const [y, m, t] = s.split('-').map(Number); return new Date(y, m - 1, t); };
  const today = new Date(new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Vienna' }).format(new Date()) + 'T00:00:00');
  const list = (D.EVENTS || []).filter(e => e && e.datum && pick(e.titel))
    .map(e => { const tage = [].concat(e.datum).map(d).filter(t => t >= today).sort((a, b) => a - b); return { ...e, tage, tag: tage[0] }; })
    .filter(e => e.tag).sort((a, b) => a.tag - b.tag);
  if (!list.length) return;

  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  const box = document.querySelector('#events .events');
  list.forEach(e => {
    const a = el('a', 'event');
    a.href = e.link || D.RESERVIEREN;
    if (e.bild) {
      const m = el('div', 'event__img'); const img = document.createElement('img');
      img.src = e.bild; img.alt = ''; img.loading = 'lazy'; m.appendChild(img); a.appendChild(m);
    }
    const b = el('div', 'event__body');
    const datum = e.tage.length > 1 ? D.termine(e.tage, false) : e.tag.toLocaleDateString('de-AT', { weekday: 'short', day: 'numeric', month: 'long' });
    b.appendChild(el('p', 'when', e.zeit ? `${datum} · ${e.zeit} Uhr` : datum));
    b.appendChild(el('h2', 'title', pick(e.titel)));
    const f = el('div', 'foot');
    if (e.preis) {
      const p = el('span', 'price', `${e.preis} pro Person`);
      if (pick(e.preisinfo)) p.appendChild(el('small', null, pick(e.preisinfo)));
      f.appendChild(p);
    }
    const btn = el('span', 'btn', 'Platz sichern'); const ar = el('i', 'arrow'); ar.setAttribute('aria-hidden', 'true'); btn.appendChild(ar);
    f.appendChild(btn);
    b.appendChild(f); a.appendChild(b);
    box.appendChild(a);
  });
  document.getElementById('events').hidden = false;
})();
</script>
</body>
</html>
